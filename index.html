<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzeloverzicht</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      --page-padding: clamp(14px, 2vw, 28px);

      display: flex;
      min-height: 100vh;
      padding: var(--page-padding);
      background: #f6f1e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(14px, 2vw, 28px);
      width: 100%;
      flex: 1;
    }

    a {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      align-items: stretch;
      overflow: hidden;
      border: 2px solid rgba(74, 65, 47, 0.18);
      border-radius: 8px;
      background: #fffdf8;
      color: #2f2a20;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(55, 45, 26, 0.12);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        border-color 180ms ease;
    }

    span {
      display: block;
      width: 100%;
      padding: clamp(8px, 1.1vw, 14px) clamp(10px, 1.7vw, 24px) clamp(2px, 0.5vw, 8px);
      text-align: center;
      font-size: clamp(1.15rem, 2vw, 2rem);
      font-weight: 700;
      line-height: 1.15;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(54, 101, 89, 0.55);
      box-shadow: 0 16px 38px rgba(55, 45, 26, 0.18);
      outline: none;
    }

    img {
      display: block;
      width: 100%;
      height: min(78%, 34vh);
      object-fit: contain;
      padding: 0 clamp(10px, 1.7vw, 24px) clamp(8px, 1.3vw, 18px);
    }

    @media (max-width: 760px) {
      body {
        min-height: auto;
      }

      main {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        min-height: auto;
      }

      a {
        min-height: 42vh;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Puzzeloverzicht">
    <a href="https://marionmichielssen-hash.github.io/bloemenpuzzel/" aria-label="Open bloemenpuzzel">
      <span>Bloemenpuzzel</span>
      <img src="assets/bloemenpuzzel.svg" alt="Bloemenpuzzel">
    </a>
    <a href="https://marionmichielssen-hash.github.io/blokkenpuzzel/" aria-label="Open blokkenpuzzel">
      <span>Blokkenpuzzel</span>
      <img src="assets/blokkenpuzzel.svg" alt="Blokkenpuzzel">
    </a>
    <a href="https://whoisip.be/kalendermoeder.html" aria-label="Open kalender">
      <span>Kalender</span>
      <img src="assets/kalender.svg" alt="Kalender">
    </a>
    <a href="https://marionmichielssen-hash.github.io/pijlenpuzzel/" aria-label="Open pijlenpuzzel">
      <span>Pijlenpuzzel</span>
      <img src="assets/pijlenpuzzel.svg" alt="Pijlenpuzzel">
    </a>
    <a href="https://puzzle-app1-43899.web.app/" aria-label="Open fotopuzzel">
      <span>Fotopuzzel</span>
      <img src="assets/fotopuzzel.svg" alt="Fotopuzzel">
    </a>
    <a href="https://www.scrabblewoordenboek.nl/" aria-label="Open scrabblewoordenboek">
      <span>Scrabbelwoordenboek</span>
      <img src="assets/scrabblewoordenboek.svg" alt="Scrabblewoordenboek">
    </a>
  </main>
</body>
</html>
