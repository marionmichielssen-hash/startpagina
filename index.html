<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzeloverzicht</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      --page-padding: clamp(14px, 2vw, 28px);

      display: flex;
      width: 100vw;
      height: 100vh;
      padding: var(--page-padding);
      background: #f6f1e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(14px, 2vw, 28px);
      width: 100%;
      height: 100%;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }

    .tile {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      align-items: stretch;
      overflow: hidden;
      border: 2px solid rgba(74, 65, 47, 0.18);
      border-radius: 8px;
      background: #fffdf8;
      color: #2f2a20;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(55, 45, 26, 0.12);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        border-color 180ms ease;
    }

    span {
      display: block;
      width: 100%;
      padding: clamp(8px, 1.1vw, 14px) clamp(10px, 1.7vw, 24px) clamp(2px, 0.5vw, 8px);
      text-align: center;
      font-size: clamp(1.15rem, 2vw, 2rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .tile:hover,
    .tile:focus-visible,
    .tile:focus-within {
      transform: translateY(-3px);
      border-color: rgba(54, 101, 89, 0.55);
      box-shadow: 0 16px 38px rgba(55, 45, 26, 0.18);
      outline: none;
    }

    .tile > img {
      display: block;
      width: 100%;
      height: min(74%, 34vh);
      object-fit: contain;
      padding: 0 clamp(10px, 1.7vw, 24px) clamp(8px, 1.3vw, 18px);
    }

    .calendar-tile {
      position: relative;
      background: #000000;
    }

    .calendar-frame {
      width: 175%;
      height: 175%;
      border: 0;
      transform: scale(0.57);
      transform-origin: top left;
      pointer-events: none;
    }

    .calendar-cover {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    @media (max-width: 760px), (max-height: 520px) {
      body {
        --page-padding: clamp(8px, 2vw, 14px);
      }

      main {
        gap: clamp(8px, 1.6vw, 14px);
      }

      span {
        padding: 6px 6px 2px;
        font-size: clamp(0.7rem, 2.7vw, 1.05rem);
      }

      .tile > img {
        height: min(70%, 31vh);
        padding: 0 6px 6px;
      }

      .calendar-frame {
        width: 205%;
        height: 205%;
        transform: scale(0.488);
      }
    }
  </style>
</head>
<body>
  <main aria-label="Puzzeloverzicht">
    <a class="tile" href="https://marionmichielssen-hash.github.io/bloemenpuzzel/" aria-label="Open bloemenpuzzel">
      <span>Bloemenpuzzel</span>
      <img src="assets/bloemenpuzzel.svg" alt="Bloemenpuzzel">
    </a>
    <a class="tile" href="https://marionmichielssen-hash.github.io/blokkenpuzzel/" aria-label="Open blokkenpuzzel">
      <span>Blokkenpuzzel</span>
      <img src="assets/blokkenpuzzel.svg" alt="Blokkenpuzzel">
    </a>
    <div class="tile calendar-tile">
      <iframe class="calendar-frame" src="https://whoisip.be/kalendermoeder.html" title="Kalender" scrolling="no"></iframe>
      <a class="calendar-cover" href="https://whoisip.be/kalendermoeder.html" aria-label="Open kalender"></a>
    </div>
    <a class="tile" href="https://marionmichielssen-hash.github.io/pijlenpuzzel/" aria-label="Open pijlenpuzzel">
      <span>Pijlenpuzzel</span>
      <img src="assets/pijlenpuzzel.svg" alt="Pijlenpuzzel">
    </a>
    <a class="tile" href="https://puzzle-app1-43899.web.app/" aria-label="Open fotopuzzel">
      <span>Fotopuzzel</span>
      <img src="assets/fotopuzzel.svg" alt="Fotopuzzel">
    </a>
    <a class="tile" href="https://www.scrabblewoordenboek.nl/" aria-label="Open scrabblewoordenboek">
      <span>Scrabbelwoordenboek</span>
      <img src="assets/scrabblewoordenboek.svg" alt="Scrabblewoordenboek">
    </a>
  </main>
</body>
</html>
